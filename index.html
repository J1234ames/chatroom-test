<!DOCTYPE html>
<html>
<body>
  <p id="v-indicator">1</p>
  <textarea id="message-input" rows="5" cols="30" placeholder="Enter your message here"></textarea><br>
  <button onclick="sendMessage()">Send</button>
  <p id="message-display">Your message:</p>
<script>
  function sendMessage() {
    const message = document.getElementById("message-input").value;
    const log = localStorage.getItem("log");
    log += " " + message;
    document.getElementById("message-display").innerHTML = "Your message<br>" + log;
    localStorage.setItem("log",log);
  };
</script>
</body>
</html>

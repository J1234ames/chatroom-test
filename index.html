<!DOCTYPE html>
<html>
<body>
  <button onclick="loadJSON()">Send</button>
  <p id="message-display">Your message:</p>
<script>
  async function loadJSON() {
    const response = await fetch("log.json");
    const log = await response.json();
    document.getElementById("message-display").innerHTML += "<br>" + log;
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
  <textarea id="message" rows="10" cols="15" placeholder="Enter your message here"></textarea>
  <button onclick="sendMessage()">Send</button>
  <p id="message-display">Your message:</p>
<script>
  async function sendMessage() {
    const message = document.getElementById("message").value;
    const response = await fetch("/api/message", {
      method: "POST";
      headers: {
        "Content-Type": "application/json"
      };
      body: JSON.stringify(message)
    });
    const result = await response.json();
    const messageDisp = document.getElementById("message-display");
    messageDisp.innerHTML = "<br>" + result;
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
  <textarea id="message-input" rows="5" cols="30" placeholder="Enter your message here"></textarea><br>
  <button onclick="sendMessage()">Send</button>
  <p id="message-display">Your message:</p>
<script>
  function sendMessage() {
    const log = loadJSON();
    document.getElementById("message-display").innerHTML += "<br>" + log;
  };
  async function loadJSON() {
    const response = await fetch("log.json");
    return await response.json();
  };
</script>
</body>
</html>
